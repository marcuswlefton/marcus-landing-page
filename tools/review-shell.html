<div id="marcus-homepage-review">
  <style>
    #marcus-homepage-review{background:#080909;color:#eeede7;font:14px/1.5 Arial,sans-serif;width:100%}
    #marcus-homepage-review .review-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:15px 110px 15px 16px;border-bottom:1px solid #30332e}
    #marcus-homepage-review .review-controls button{font:inherit;background:#161916;color:#eeede7;border:1px solid #4d5347;border-radius:6px;min-height:44px;padding:9px 16px;cursor:pointer}
    #marcus-homepage-review .review-controls button[aria-pressed="true"]{background:#eeede7;color:#080909}
    #marcus-homepage-review .review-controls button:focus-visible{outline:2px solid #c7b78d;outline-offset:3px}
    #marcus-homepage-review .review-caption{padding:10px 16px;color:#b9bcb3;margin:0}
    #marcus-homepage-review iframe{display:block;width:100%;height:800px;border:0;background:#080909}
    #marcus-homepage-review textarea{display:block;width:100%;height:660px;box-sizing:border-box;padding:20px;background:#101210;color:#eeede7;border:0;font:13px/1.6 monospace;resize:vertical}
    #marcus-homepage-review [hidden]{display:none!important}
    #marcus-homepage-review .copy-status{color:#c7b78d}
  </style>
  <div class="review-controls" aria-label="Homepage review controls">
    <button type="button" data-mode="preview" aria-pressed="true">Preview</button>
    <button type="button" data-mode="code" aria-pressed="false">Code</button>
    <button type="button" id="copy-homepage">Copy HTML</button>
    <span class="copy-status" role="status" aria-live="polite"></span>
  </div>
  <p class="review-caption">Homepage review · Interactive model enabled · Forms do not submit in this preview</p>
  <iframe title="Marcus Lefton — revised homepage" sandbox="allow-scripts" srcdoc="__PREVIEW__"></iframe>
  <div class="review-code" hidden><label for="homepage-source" class="review-caption">Complete homepage HTML · CSS, images, fonts, and interaction included</label><textarea id="homepage-source" readonly spellcheck="false">__SOURCE__</textarea></div>
</div>
<script>
(() => {
  const root = document.getElementById('marcus-homepage-review');
  const frame = root.querySelector('iframe');
  const code = root.querySelector('.review-code');
  const source = root.querySelector('textarea');
  const status = root.querySelector('.copy-status');
  function setMode(mode) {
    root.querySelectorAll('[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
    frame.hidden = mode !== 'preview'; code.hidden = mode !== 'code';
  }
  root.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
  root.querySelector('#copy-homepage').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(source.value); status.textContent = 'Copied.'; }
    catch (_) { setMode('code'); source.focus(); source.select(); status.textContent = 'Code selected. Press ⌘C or Ctrl+C to copy.'; }
  });
})();
</script>
